[versions]
agp = "8.10.1"
kotlin = "2.0.21"
coreKtx = "1.16.0"
# :shezguard-core only. 1.9.0 is the first release with IntentSanitizer and needs consumers on
# compileSdk >= 33 (1.16.0 needs compileSdk >= 35 and AGP >= 8.6.0). docs/PAPER_NOTES.md N9.
androidxCore = "1.9.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
robolectric = "4.14.1"
# :shezguard-lint only. Lint version = AGP version + 23.0.0 (AGP 8.10.1 -> Lint 31.10.1), step 13.
lint = "31.10.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Step 14, androidTest compile-only (for @Config on src/sharedTest classes). Same version as robolectric.
robolectric-annotations = { group = "org.robolectric", name = "annotations", version.ref = "robolectric" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lint" }
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lint" }
# Test-only: built-in detectors (CheckResult, AppLinkWarning) and LintCliFlags, used to show what ShezGuard does not duplicate.
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lint" }
lint-cli = { group = "com.android.tools.lint", name = "lint", version.ref = "lint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
